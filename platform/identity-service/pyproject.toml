[project]
name = "forkhatri-identity-service"
version = "0.1.0"
description = "ForKhatri Identity & Trust Service: canonical member identity, sessions and the module registry (ARCHITECTURE.md ADR-004; contract docs/ParentApp/07-tech-reqs.md)."
requires-python = ">=3.12"

# Pinned to the versions already resolved and running for MOD02 Milavn and
# MOD03 Mangaly on this machine, so the platform and modules share one baseline.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "greenlet==3.5.5",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
    "email-validator==2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.1",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# SQL text blocks read better unwrapped.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
