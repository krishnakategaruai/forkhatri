[project]
name = "mangaly-service"
version = "0.1.0"
description = "MangalyService (MOD03) — FastAPI backend. One process, one Python package per component (CODING-GUIDE.md §2)."
requires-python = ">=3.12"

# Resolved versions, captured at build time (see 09a-external-dependencies.md).
# Every entry here is a real, currently-published version resolved from PyPI on
# 2026-09-13 — not a remembered or planned-at-design-time version.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "greenlet==3.5.5",
    "argon2-cffi==25.1.0",
    "python-dotenv==1.2.1",
    # [identity_bridge/delivery.py, DEC-V1-011/DEC-V1-012] Real Twilio SMS
    # calls at runtime — moved here from dev-only after being added under
    # `dev` by mistake (httpx started as a test-only client, delivery.py's
    # later use of it for production traffic wasn't reflected here).
    "httpx==0.28.1",
    # [api/routes/profile.py, FR001] multipart/form-data for photo upload.
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.1",
    "mypy==1.19.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The async engine is created once per module and its connections are bound to
# the loop that created them. Without pinning both scopes to the session loop,
# pytest-asyncio gives each test a fresh loop and every pooled connection from
# the module-scoped engine fails with "attached to a different loop".
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
