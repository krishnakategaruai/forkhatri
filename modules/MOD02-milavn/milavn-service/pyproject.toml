[project]
name = "milavn-service"
version = "0.1.0"
description = "Milavn (MOD02) — FastAPI module package. One process shape shared with the Core Platform monolith; one Python package per component (architecture.md §2)."
requires-python = ">=3.12"

# Resolved versions captured at build time (see AgentOutputs/09a-external-dependencies.md).
# Pinned to the exact versions already resolved and running for MOD03 Mangaly on
# this machine (2026-09-13), so both modules share one dependency baseline.
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "SQLAlchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "greenlet==3.5.5",
    "python-dotenv==1.2.1",
    "python-multipart==0.0.32",
    "httpx==0.28.1",
    # Windows has no system tz database; IST day boundaries (FR004) need one.
    "tzdata==2025.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.1",
    "pytest-asyncio==1.3.0",
    "ruff==0.15.1",
]

[tool.ruff]
line-length = 170
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Long lines here are SQL text blocks and bind-parameter dicts; wrapping them
# hurts readability more than it helps.
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
